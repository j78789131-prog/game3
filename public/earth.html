<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Skybound Earth</title><link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Widgets/widgets.css"><style>html,body,#globe{width:100%;height:100%;margin:0;overflow:hidden;background:#07111f}.cesium-viewer-bottom{display:none}.toolbar{position:absolute;z-index:5;top:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap}.toolbar button,.toolbar select{background:#0b1b2ddd;color:#e8f5ff;border:1px solid #3d6688;border-radius:9px;padding:9px;font:12px system-ui}.status{position:absolute;bottom:12px;left:12px;color:#c5d8e8;background:#07111fcc;padding:8px 11px;border-radius:8px;font:12px system-ui}</style></head><body><div id="globe"></div><div class="toolbar"><select id="mode"><option value="3D">3D Globe</option><option value="2D">2D Map</option><option value="COLUMBUS">Columbus View</option></select><select id="imagery"><option value="satellite">Satellite</option><option value="street">Street</option></select><select id="weather"><option value="none">Weather off</option><option value="temperature">Temperature</option><option value="precipitation">Precipitation</option><option value="clouds">Clouds</option><option value="pressure">Pressure</option><option value="wind">Wind</option></select><input id="opacity" aria-label="Layer opacity" type="range" min="0" max="100" value="72"></div><div class="status" id="status">Loading Cesium Earth…</div><script src="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Cesium.js"></script><script>(async()=>{const status=document.getElementById('status');try{const cfg=await fetch('/api/config').then(r=>r.json());if(!cfg.cesiumIonToken){status.textContent='Add CESIUM_ION_TOKEN in Render to enable terrain.';return;}Cesium.Ion.defaultAccessToken=cfg.cesiumIonToken;const viewer=new Cesium.Viewer('globe',{terrain:await Cesium.Terrain.fromWorldTerrain(),animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:true,sceneModePicker:false,navigationHelpButton:false,infoBox:false,selectionIndicator:false});viewer.scene.globe.enableLighting=true;viewer.scene.globe.showWaterEffect=true;viewer.scene.globe.depthTestAgainstTerrain=true;const params=new URLSearchParams(location.search);const initialMode=params.get('mode')||'3D';document.getElementById('mode').value=initialMode;viewer.scene.mode=({'3D':Cesium.SceneMode.SCENE3D,'2D':Cesium.SceneMode.SCENE2D,'COLUMBUS':Cesium.SceneMode.COLUMBUS_VIEW})[initialMode]||Cesium.SceneMode.SCENE3D;const initialImagery=params.get('imagery')||'satellite';document.getElementById('imagery').value=initialImagery;if(initialImagery==='street'){viewer.imageryLayers.removeAll();viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}));}document.getElementById('weather').value=params.get('weather')||'none';document.getElementById('opacity').value=params.get('opacity')||'72';viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(10,25,18000000)});let weatherLayer=null;const setWeather=()=>{if(weatherLayer){viewer.imageryLayers.remove(weatherLayer);weatherLayer=null;}const v=document.getElementById('weather').value;if(v!=='none'){weatherLayer=viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:'/api/weather/'+v+'/{z}/{x}/{y}.png',tilingScheme:new Cesium.WebMercatorTilingScheme(),maximumLevel:8}));weatherLayer.alpha=Number(document.getElementById('opacity').value)/100;}};document.getElementById('weather').onchange=setWeather;setWeather();document.getElementById('opacity').oninput=e=>{if(weatherLayer)weatherLayer.alpha=Number(e.target.value)/100;};document.getElementById('mode').onchange=e=>viewer.scene.mode=({'3D':Cesium.SceneMode.SCENE3D,'2D':Cesium.SceneMode.SCENE2D,'COLUMBUS':Cesium.SceneMode.COLUMBUS_VIEW})[e.target.value];document.getElementById('imagery').onchange=async e=>{const layer=e.target.value==='street'?new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'}):await Cesium.IonImageryProvider.fromAssetId(2);viewer.imageryLayers.removeAll();viewer.imageryLayers.addImageryProvider(layer);weatherLayer=null;setWeather();};status.textContent='Cesium World Terrain ready · drag to explore';window.skyboundViewer=viewer;}catch(e){status.textContent='Earth could not load: '+e.message;console.error(e);}})();</script></body></html>
